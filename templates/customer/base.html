<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}手艺云创 - 民族手工艺数字化平台{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8f9fa; color: #2d3436; }
        
        /* 导航栏 */
        .navbar { background: linear-gradient(135deg, #6C5CE7 0%, #a29bfe 100%); color: white; padding: 0 40px; height: 64px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 10px rgba(108, 92, 231, 0.2); position: sticky; top: 0; z-index: 100; }
        .navbar .logo { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .navbar .logo-icon { font-size: 28px; }
        .navbar .nav-links { display: flex; gap: 8px; }
        .navbar .nav-links a { color: white; text-decoration: none; padding: 8px 20px; border-radius: 20px; transition: all 0.3s; font-size: 15px; }
        .navbar .nav-links a:hover, .navbar .nav-links a.active { background: rgba(255,255,255,0.2); }
        .navbar .admin-entry { background: rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 20px; font-size: 14px; color: white; text-decoration: none; transition: all 0.3s; }
        .navbar .admin-entry:hover { background: rgba(255,255,255,0.25); }
        
        /* 主内容区 */
        .main-content { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        
        /* Hero区域 */
        .hero { text-align: center; padding: 60px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 20px; margin-bottom: 40px; }
        .hero h1 { font-size: 36px; margin-bottom: 16px; }
        .hero p { font-size: 18px; opacity: 0.9; margin-bottom: 30px; }
        .hero-buttons { display: flex; gap: 16px; justify-content: center; }
        .hero-btn { padding: 12px 32px; border-radius: 30px; text-decoration: none; font-size: 16px; font-weight: 500; transition: all 0.3s; }
        .hero-btn.primary { background: white; color: #6C5CE7; }
        .hero-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .hero-btn.secondary { border: 2px solid white; color: white; }
        .hero-btn.secondary:hover { background: rgba(255,255,255,0.1); }
        
        /* 功能卡片 */
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-bottom: 40px; }
        .feature-card { background: white; border-radius: 16px; padding: 32px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.06); transition: all 0.3s; text-decoration: none; color: inherit; }
        .feature-card:hover { transform: translateY(-5px); box-shadow: 0 8px 30px rgba(108, 92, 231, 0.15); }
        .feature-icon { font-size: 48px; margin-bottom: 16px; }
        .feature-card h3 { font-size: 20px; margin-bottom: 10px; color: #2d3436; }
        .feature-card p { color: #636e72; font-size: 14px; line-height: 1.6; }
        
        /* 统计数据 */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 40px; }
        .stat-card { background: white; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .stat-number { font-size: 36px; font-weight: bold; color: #6C5CE7; margin-bottom: 8px; }
        .stat-label { color: #636e72; font-size: 14px; }
        
        /* 热门纹样 */
        .section-title { font-size: 24px; margin-bottom: 24px; color: #2d3436; display: flex; align-items: center; gap: 10px; }
        .pattern-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .pattern-item { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: all 0.3s; }
        .pattern-item:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .pattern-thumb { height: 140px; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; align-items: center; justify-content: center; font-size: 48px; }
        .pattern-info { padding: 12px 16px; }
        .pattern-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .pattern-origin { font-size: 12px; color: #636e72; }
        
        /* 页脚 */
        .footer { text-align: center; padding: 30px; color: #b2bec3; font-size: 13px; margin-top: 40px; }
        
        /* 上传区域 */
        .upload-section { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 30px; }
        .upload-area { border: 2px dashed #dfe6e9; border-radius: 12px; padding: 50px; text-align: center; transition: all 0.3s; cursor: pointer; }
        .upload-area:hover { border-color: #6C5CE7; background: #f8f7ff; }
        .upload-area.dragover { border-color: #6C5CE7; background: #f0edff; }
        .upload-icon { font-size: 56px; margin-bottom: 16px; }
        .upload-text { font-size: 18px; color: #2d3436; margin-bottom: 8px; }
        .upload-hint { font-size: 14px; color: #b2bec3; }
        .upload-btn { margin-top: 20px; padding: 12px 32px; background: linear-gradient(135deg, #6C5CE7, #a29bfe); color: white; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4); }
        
        /* 结果区域 */
        .results-section { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .results-title { font-size: 20px; margin-bottom: 20px; color: #2d3436; }
        .result-list { display: flex; flex-direction: column; gap: 16px; }
        .result-item { display: flex; gap: 20px; padding: 16px; border-radius: 12px; border: 1px solid #f0f0f0; transition: all 0.3s; }
        .result-item:hover { border-color: #6C5CE7; background: #faf9ff; }
        .result-thumb { width: 80px; height: 80px; border-radius: 8px; background: linear-gradient(135deg, #f5f7fa, #c3cfe2); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; }
        .result-info { flex: 1; }
        .result-name { font-weight: 600; font-size: 16px; margin-bottom: 6px; }
        .result-meta { font-size: 13px; color: #636e72; margin-bottom: 6px; }
        .result-desc { font-size: 13px; color: #636e72; line-height: 1.5; }
        .similarity { flex-shrink: 0; text-align: center; }
        .similarity-value { font-size: 24px; font-weight: bold; color: #6C5CE7; }
        .similarity-label { font-size: 12px; color: #b2bec3; }
        
        /* 设计表单 */
        .design-form { background: white; border-radius: 16px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 30px; }
        .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-weight: 500; font-size: 14px; color: #2d3436; }
        .form-group select, .form-group input, .form-group textarea { padding: 10px 14px; border: 1px solid #dfe6e9; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        .form-group select:focus, .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #6C5CE7; }
        .form-group.full { grid-column: 1 / -1; }
        .submit-btn { padding: 12px 40px; background: linear-gradient(135deg, #6C5CE7, #a29bfe); color: white; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4); }
        
        /* 设计结果 */
        .design-result { background: white; border-radius: 16px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .design-title { font-size: 22px; margin-bottom: 20px; color: #2d3436; }
        .color-palette { display: flex; gap: 12px; margin-bottom: 24px; }
        .color-swatch { width: 60px; height: 60px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .suggestions { background: #f8f7ff; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
        .suggestions h4 { color: #6C5CE7; margin-bottom: 12px; }
        .suggestions ul { padding-left: 20px; color: #636e72; line-height: 1.8; font-size: 14px; }
        .reference-patterns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .ref-pattern { text-align: center; padding: 16px; border-radius: 10px; background: #f8f9fa; }
        .ref-icon { font-size: 36px; margin-bottom: 8px; }
        .ref-name { font-size: 13px; font-weight: 500; }
        
        /* 返回链接 */
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: #6C5CE7; text-decoration: none; margin-bottom: 20px; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .navbar { padding: 0 20px; }
            .navbar .nav-links { display: none; }
            .hero h1 { font-size: 28px; }
            .stats { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .reference-patterns { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <span class="logo-icon">🎨</span>
            <span>手艺云创</span>
        </div>
        <div class="nav-links">
            <a href="{{ url_for('customer.index') }}" class="{% if request.endpoint == 'customer.index' %}active{% endif %}">首页</a>
            <a href="{{ url_for('customer.recognize') }}" class="{% if request.endpoint == 'customer.recognize' %}active{% endif %}">纹样识别</a>
            <a href="{{ url_for('customer.design') }}" class="{% if request.endpoint == 'customer.design' %}active{% endif %}">智能设计</a>
        </div>
        <a href="{{ url_for('auth.login') }}" class="admin-entry">管理后台 →</a>
    </nav>
    
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
    
    <div class="footer">
        © 2024 手艺云创 - 民族手工艺数字化平台 | 传承文化 · 创新设计
    </div>
</body>
</html>
